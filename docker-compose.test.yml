services:
  tests:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: >-
      bash -c "pip install -q -r services/execution/requirements.txt -r services/auth/requirements.txt -r services/workflow/requirements.txt pytest pytest-asyncio ruff &&
      ruff check --no-cache libs services &&
      (cd libs/common && python -m pytest -q -p no:cacheprovider) &&
      (cd services/auth && python -m pytest -q -p no:cacheprovider) &&
      (cd services/workflow && python -m pytest -q -p no:cacheprovider) &&
      (cd services/execution && python -m pytest -q -p no:cacheprovider)"