services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  workflow:
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"

  execution:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://execution_user:execution_pass@postgres:5432/execution_db
      REDIS_URL: redis://redis:6379/0
      WORKFLOW_SERVICE_URL: http://workflow:8000
      ALLOW_LOCAL_FILES: "true"
      LOCAL_FILES_DIR: /data/files
    volumes:
      - ./data/files:/data/files:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow:
        condition: service_started
    ports:
      - "8003:8000"

volumes:
  postgres_data:
  mongo_data: