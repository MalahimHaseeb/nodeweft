apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: nodeweft
  labels:
    app: auth
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        nodeweft/env-hash: "${ENV_HASH_AUTH}"
    spec:
      imagePullSecrets:
        - name: ecr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: ${ECR_REGISTRY}/nodeweft-auth:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: auth-env
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: nodeweft
  labels:
    app: auth
spec:
  type: NodePort
  selector:
    app: auth
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30001
